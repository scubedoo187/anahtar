[workspace]
members = [
    "crates/anahtar-core",
    "crates/anahtar-app",
    "crates/anahtar-cli",
]
exclude = [
    "spikes/keepass-compat",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
keepass = { version = "0.13.8", features = ["save_kdbx4", "totp"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
toml = "0.8"
directories = "5"
arboard = "3"
rand = "0.8"
tempfile = "3"
