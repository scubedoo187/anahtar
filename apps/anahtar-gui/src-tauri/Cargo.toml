[workspace]

[package]
name = "anahtar-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "anahtar_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anahtar-app = { path = "../../../crates/anahtar-app" }
anahtar-core = { path = "../../../crates/anahtar-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
